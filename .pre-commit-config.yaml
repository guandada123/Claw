# Pre-commit hooks — Claw (A股投顾自动化助手)
# Install: pip install pre-commit && pre-commit install --hook-type commit-msg
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(\.workbuddy/(automations|memory|data|reports|templates|docs)/|archive/)
      - id: end-of-file-fixer
        # 机器生成的数据 JSON 常被脚本重写且不带结尾换行，排除以避免 CI 抖动；
        # 源码 .py 仍强制结尾换行（见下方单独修正）
        exclude: ^(\.workbuddy/(automations|memory|data|reports|templates|docs)/|archive/|\.workbuddy/scripts/.*\.json$|src/claw/strategies/.*\.json$|experiments/.*\.json$)
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^\.workbuddy/data/
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.17
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config, ruff.toml]
        # 2026-09-29：不再限定 .workbuddy/ —— 全仓 `ruff check .` 实测 0 命中，扩面零风险；
        # 原范围让 tests/ 的 N802/S108 只能靠"工程质量报告"事后发现（报告发现了也没门禁挡）。
      - id: ruff-format
        args: [--config, ruff.toml]
        files: ^\.workbuddy/   # format 仍只覆盖 .workbuddy/（全仓有 116 个文件会被重排，属另一件事）

  # Conventional Commits 格式校验
  - repo: local
    hooks:
      - id: conventional-commit
        name: Conventional Commits
        entry: python .workbuddy/scripts/check-commit-msg.py
        language: python
        stages: [commit-msg]
        always_run: true
