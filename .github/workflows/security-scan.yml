# ============================================================
# Claw — Security Scan (Unified Standard)
# Runs: weekly schedule + on dep/code change + manual
# ============================================================
name: Security Scan

on:
  schedule:
    - cron: "0 8 * * 1"  # 每周一 8:00 UTC
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "**/*.py"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  safety-check:
    name: Dependency Scan (safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps + safety
        run: |
          pip install safety
      - name: Safety check
        # 新版 safety 中 --full-report 与 --output 互斥（usage error, exit 2），JSON 输出已含完整报告
        # 2026-10-08: 补 continue-on-error/|| true 与 QTS/StockInsight 的 v2.0 统一标准对齐 ——
        # 少了它，safety 非零退出（实测 exit 64，且未产出报告）会把整个 Security Scan 打红，
        # 而它不是本工作流的有效依赖扫描（有效的那个是下面的 pip-audit job）。
        run: safety check --output json > safety-report.json || true
        continue-on-error: true
      - name: Upload safety report
        uses: actions/upload-artifact@v7
        with:
          name: claw-safety-report
          path: safety-report.json
      - name: Summary
        run: |
          VULN_COUNT=$(python3 -c "
          import json
          with open('safety-report.json') as f:
              data = json.load(f)
          vulns = data.get('vulnerabilities', [])
          print(len(vulns))
          ") || echo "0"
          echo "## Safety Check" >> $GITHUB_STEP_SUMMARY
          echo "Vulnerabilities found: **${VULN_COUNT:-0}**" >> $GITHUB_STEP_SUMMARY

  bandit:
    name: Code Scan (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install bandit
        run: pip install bandit[toml]
      - name: Bandit scan
        run: |
          bandit -r .workbuddy/scripts/ src/claw/ scripts/ -f json -o bandit-report.json \
            -ll --skip B101,B324,B310,B108,B306
      - name: Upload bandit report
        uses: actions/upload-artifact@v7
        with:
          name: claw-bandit-report
          path: bandit-report.json
      - name: Summary
        run: |
          COUNT=$(python3 -c "
          import json
          with open('bandit-report.json') as f:
              data = json.load(f)
          print(len(data.get('results', [])))
          ") || echo "0"
          echo "## Bandit Code Scan" >> $GITHUB_STEP_SUMMARY
          echo "Issues found: **${COUNT:-0}**" >> $GITHUB_STEP_SUMMARY

  lock-audit:
    name: Lock Dependency Audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # 只依赖标准库（tomllib/urllib），**不装任何第三方包**
      # —— 刻意不用 pip-audit -r：它会先建 venv(ensurepip) 解析依赖，多一个脆弱点；
      #    且同一 CVE 会以 GHSA-*/PYSEC-* 双 ID 返回，不去重就是双倍噪音。
      - name: Audit uv.lock against OSV
        run: python3 .workbuddy/scripts/audit_locks.py
      - name: Explain failure mode
        if: failure()
        run: |
          {
            echo "## 锁文件依赖门禁未通过"
            echo ""
            echo "本次判据（刻意「只挡可处置的」）："
            echo "- **有修复版本**的漏洞 → 挡（这件事你能做）"
            echo "- **无修复版本** → 只提示不挡（上游没修，红了也变不出补丁）"
            echo ""
            echo "两种处置："
            echo "1. 升级：\`uv lock --upgrade-package <pkg>\`（根与 .workbuddy 两处都要做）"
            echo "2. 若确有原因暂不升：在 \`.workbuddy/lock_audit_allowlist.json\` 加一条，"
            echo "   **必须写 reason 与 expires**（到期即失效，逼复审）"
            echo ""
            echo "rc=2 表示**无法判定**（OSV 查询失败）—— 重跑即可；持续失败需查 OSV 可用性。"
          } >> $GITHUB_STEP_SUMMARY

  pip-audit:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps + pip-audit
        run: |
          pip install -e .
          pip install pip-audit
      - name: Run pip-audit
        # 与 QTS/StockInsight 一致：只出报告 + 摘要，不因漏洞数把 job 打红（计数进 Step Summary 供人工看）
        run: pip-audit --requirement <(pip freeze) --format json > pip-audit-report.json || true
        continue-on-error: true
      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: claw-pip-audit-report
          path: pip-audit-report.json
      - name: Summary
        run: |
          echo "## pip-audit Dependency Audit" >> $GITHUB_STEP_SUMMARY
          if [ -f pip-audit-report.json ]; then
            COUNT=$(python3 -c "
          import json
          with open('pip-audit-report.json') as f:
              data = json.load(f)
          print(len(data))
          ")
            echo "Vulnerabilities found: **${COUNT}**" >> $GITHUB_STEP_SUMMARY
          else
            echo "No report generated" >> $GITHUB_STEP_SUMMARY
          fi

  secret-scan:
    name: Secret Detection (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        # 使用 gitleaks 默认配置
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
